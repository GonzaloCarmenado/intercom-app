# Nombre de proyecto explícito: por defecto Docker Compose lo deriva del
# nombre del directorio contenedor ("docker"), que coincide con el de
# moto-routes al vivir ambos en infra/docker/ — sin esto, Compose trata los
# contenedores de los dos repos como del mismo "proyecto" (se vio como aviso
# de "orphan container docker-api-1" al desplegar por primera vez), con
# riesgo real de que un `docker compose down` en un repo afecte al otro.
name: intercom-signaling

services:
  signaling:
    build:
      context: ../../signaling
    # Solo loopback: la única vía de entrada real es Tailscale Funnel, que
    # hace de proxy local a este puerto (ver design.md). No hace falta
    # exponerlo en 0.0.0.0 ni en la LAN del servidor.
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    env_file:
      - .env.prod
    # Límites explícitos para que un fallo de este servicio (fuga de
    # memoria, bucle) no pueda hambrear a la API de moto-routes en el mismo
    # servidor — ver design.md, "Riesgos".
    mem_limit: 128m
    cpus: 0.5
